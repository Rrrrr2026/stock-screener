<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个股精研 · FairValpha</title>
<meta name="description" content="少数公司的持续跟踪档案: 本期变化、估值结论 (三情景 DCF / 历史分位 / 可比) 与十六个研究维度, 数字可追溯到 SEC EDGAR 与公开来源。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/shared/fv-shell.css?v=3">
<style>
  /* 个股精研 /deepdive/ —— 研究层 (research/deepdive/<ticker>/dossier.json, 研究员写) + 量化层 (服务器每日 09:15
     research/deepdive/build.py 写进 data/<TICKER>.json)。页面只读 data/, 不做任何网络以外的计算假设。
     令牌来自 /shared/fv-shell.css (与两市工作台同名同值); 这里内联一份核心令牌作兜底 (同 /data/ 的做法),
     shell 没同步过来本页仍是对的皮肤。颜色铁律: 涨跌 = 裸色数字 (--up 红 / --down 绿); 状态 = .fv-pill 药丸。
     图表三色 (营收蓝 / 经营利润橙 / FCF 青) 按 dataviz 校验器过了深浅两底 (--pairs all), 浅色青对比度不足 3:1
     → 每张图都有终点直接标注 + 数据表视图 (relief rule)。 */
  :root{
    --bg:#0b1220; --card:#111a2e; --border:#1e2a44; --text:#e5e7eb; --dim:#9fb4d6; --muted:#7e93b8;
    --head:#0e1830; --rowhover:#16223c; --input:#0e1830; --inputborder:#26344f; --gridline:#1b2640;
    --accent:#2962ff; --accent-ink:#7ab0ff; --up:#f87171; --down:#4ade80;
    --pass:#3ddc97; --pass-bg:rgba(61,220,151,.14); --pass-line:rgba(61,220,151,.38);
    --fail:#ff5c5c; --fail-bg:rgba(255,92,92,.14); --fail-line:rgba(255,92,92,.38);
    --warn:#f5b43c; --warn-bg:rgba(245,180,60,.14); --warn-line:rgba(245,180,60,.38);
    --info:#7ab0ff; --info-bg:rgba(41,98,255,.22); --info-line:rgba(41,98,255,.5);
    --shadow:0 6px 24px rgba(0,0,0,.35); --sab:env(safe-area-inset-bottom,0px);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70;
    --band:rgba(122,176,255,.12); --band-line:rgba(122,176,255,.45);
    --serif: Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color-scheme:dark;
  }
  :root[data-theme="light"], body.light{
    --bg:#eef2f8; --card:#ffffff; --border:#d7e0ee; --text:#0f172a; --dim:#334155; --muted:#64748b;
    --head:#eaf0f8; --rowhover:#eaf1fb; --input:#ffffff; --inputborder:#cbd5e1; --gridline:#e6ecf5;
    --accent:#2962ff; --accent-ink:#0b57d0; --up:#ef4444; --down:#16a34a;
    --pass:#0c8a54; --pass-bg:rgba(12,138,84,.12); --pass-line:rgba(12,138,84,.35);
    --fail:#c22525; --fail-bg:rgba(194,37,37,.10); --fail-line:rgba(194,37,37,.32);
    --warn:#9a6a00; --warn-bg:rgba(245,158,11,.14); --warn-line:rgba(245,158,11,.40);
    --info:#0b57d0; --info-bg:rgba(41,98,255,.10); --info-line:rgba(41,98,255,.30);
    --shadow:0 6px 20px rgba(15,23,42,.12);
    --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
    --band:rgba(11,87,208,.08); --band-line:rgba(11,87,208,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]):not([data-theme="light"]){
      --bg:#eef2f8; --card:#ffffff; --border:#d7e0ee; --text:#0f172a; --dim:#334155; --muted:#64748b;
      --head:#eaf0f8; --rowhover:#eaf1fb; --input:#ffffff; --inputborder:#cbd5e1; --gridline:#e6ecf5;
      --accent-ink:#0b57d0; --up:#ef4444; --down:#16a34a;
      --pass:#0c8a54; --pass-bg:rgba(12,138,84,.12); --pass-line:rgba(12,138,84,.35);
      --fail:#c22525; --fail-bg:rgba(194,37,37,.10); --fail-line:rgba(194,37,37,.32);
      --warn:#9a6a00; --warn-bg:rgba(245,158,11,.14); --warn-line:rgba(245,158,11,.40);
      --info:#0b57d0; --info-bg:rgba(41,98,255,.10); --info-line:rgba(41,98,255,.30);
      --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --band:rgba(11,87,208,.08); --band-line:rgba(11,87,208,.35);
      color-scheme:light;
    }
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-padding-top:112px; -webkit-text-size-adjust:100%; }
  body{ background:var(--bg); color:var(--text); font:14px/1.65 var(--sans); overflow-x:hidden; }
  a{ color:var(--accent-ink); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  button{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .num, .t td.num{ font-variant-numeric:tabular-nums; }
  .up{ color:var(--up); } .down{ color:var(--down); } .flat{ color:var(--dim); }
  .mut{ color:var(--muted); } .dim{ color:var(--dim); }
  .serif{ font-family:var(--serif); }
  [hidden]{ display:none !important; }

  /* ---- 外壳缺席时的极简页头 (同 /data/) ---- */
  #fvFallback{ position:sticky; top:0; z-index:60; height:48px; display:flex; align-items:center;
    gap:8px; padding:0 10px; background:var(--card); border-bottom:1px solid var(--border); }
  #fvFallback a{ color:var(--dim); font-size:13px; font-weight:600; }
  #fvFallback span{ font-size:14px; font-weight:600; color:var(--text); }

  /* ---- 公司切换 (贴在外壳下) ---- */
  .cotabs{ position:sticky; top:0; z-index:55; background:var(--card); border-bottom:1px solid var(--border); }
  html.fv-shell-on .cotabs{ top:48px; }
  .cotabs .in{ max-width:1180px; margin:0 auto; padding:0 20px; display:flex; gap:4px; }
  .cotab{ flex:0 0 auto; min-height:46px; padding:6px 14px 4px; background:none; border:0; cursor:pointer;
    border-bottom:2px solid transparent; display:flex; align-items:baseline; gap:8px; color:var(--dim); text-align:left; }
  .cotab:hover{ color:var(--text); background:var(--rowhover); }
  .cotab.on{ color:var(--text); border-bottom-color:var(--accent); }
  .cotab b{ font-size:14px; letter-spacing:.02em; }
  .cotab .nm{ font-size:12.5px; }
  .cotab .d{ font-size:12px; font-variant-numeric:tabular-nums; }
  .cotab .fv-pill{ font-size:10.5px; padding:0 6px; align-self:center; }

  .banner{ max-width:1180px; margin:12px auto 0; padding:0 20px; }
  .banner > div{ padding:8px 12px; border-radius:6px; font-size:12.5px; line-height:1.6;
    background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line); }

  /* ---- 骨架: 桌面左侧章节栏 + 主栏 ---- */
  .page{ max-width:1180px; margin:0 auto; padding:0 20px calc(48px + var(--sab)); }
  .rail{ display:none; }
  @media (min-width:1100px){
    .page{ display:grid; grid-template-columns:152px minmax(0,1fr); gap:0 40px; }
    .rail{ display:block; position:sticky; top:118px; align-self:start; max-height:calc(100vh - 132px);
      overflow:auto; padding:22px 0 12px; font-size:12.5px; line-height:1.45; scrollbar-width:thin; }
    .rail a{ display:block; padding:4px 0 4px 10px; color:var(--muted); border-left:2px solid var(--gridline); }
    .rail a:hover{ color:var(--text); text-decoration:none; }
    .rail a.on{ color:var(--text); border-left-color:var(--accent); }
    .rail .grp{ margin:12px 0 4px 12px; font-size:11.5px; color:var(--dim); }
    .rail a.sub{ padding-left:18px; font-size:12px; }
  }
  main{ min-width:0; }

  /* ---- 页眉 ---- */
  .mast{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 40px; padding:26px 0 20px; }
  .co{ min-width:0; }
  .co-name{ font-family:var(--serif); font-size:36px; font-weight:600; line-height:1.12; letter-spacing:.01em; }
  .co-en{ font-family:var(--serif); font-size:17px; color:var(--dim); margin-top:4px; }
  .co-rest{ font-size:18px; font-weight:400; color:var(--dim); letter-spacing:0; }
  .co-meta{ font-size:12.5px; color:var(--muted); margin-top:8px; }
  .px{ text-align:right; align-self:end; }
  .px .lab{ font-size:12px; color:var(--muted); }
  .px .v{ font-family:var(--serif); font-size:42px; font-weight:600; line-height:1.05; }
  .px .chg{ font-size:17px; font-weight:600; margin-left:10px; font-variant-numeric:tabular-nums; }
  .px .row{ display:flex; gap:2px 14px; justify-content:flex-end; flex-wrap:wrap; font-size:12.5px; margin-top:6px;
    font-variant-numeric:tabular-nums; color:var(--muted); }
  .px .row b{ font-weight:600; }
  /* 活的估值读数: 现价 (量化层每日) 对研究层合理区间 —— 首屏必须看得到, 研究员那句一行结论是研究时价写的 */
  .px .fairln{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:2px 14px; margin-top:10px; padding-top:8px;
    border-top:1px solid var(--gridline); font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .px .fairln b{ color:var(--text); font-weight:650; }
  .px .fairln b.up{ color:var(--up); } .px .fairln b.down{ color:var(--down); }
  .px .fairln a{ color:var(--accent-ink); white-space:nowrap; }
  .lede{ grid-column:1 / -1; display:flex; gap:12px; align-items:baseline; margin-top:12px; }
  .lede p{ font-size:15.5px; line-height:1.75; max-width:52em; }
  .lede .at{ display:inline-block; margin-left:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .metaline{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 22px; font-size:12px; color:var(--muted);
    margin-top:10px; padding-top:10px; border-top:1px solid var(--gridline); }
  .metaline b{ color:var(--dim); font-weight:600; }
  .metaline .fv-pill{ margin-left:6px; }

  /* ---- 章节 ---- */
  section.sec{ border-top:1px solid var(--border); padding:24px 0 26px; }
  .sec-h{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .sec-h h2{ font-size:16px; font-weight:650; }
  .sec-h .cap{ font-size:12px; color:var(--muted); }
  h3.sub-h{ font-size:13.5px; font-weight:600; margin:22px 0 10px; color:var(--text); }

  /* ---- 本期变化 ---- */
  .changes{ display:grid; grid-template-columns:minmax(0,1.75fr) minmax(250px,1fr); gap:0 40px; }
  ol.wc{ list-style:none; }
  ol.wc li{ display:grid; grid-template-columns:84px minmax(0,1fr); gap:10px; padding:10px 0; border-bottom:1px solid var(--gridline); }
  ol.wc li:first-child{ padding-top:2px; }
  ol.wc .dt{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px; }
  ol.wc .tx{ font-size:14px; line-height:1.7; }
  ol.wc .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:3px; }
  .dimlink{ font-size:12px; color:var(--dim); padding:4px 0; }
  table.t.mult{ width:auto; min-width:100%; }
  table.t.mult td.num, table.t.mult th.num{ width:1%; padding-left:16px; }
  table.t.mult td.dist, table.t.mult th.dist{ padding-left:22px; }
  .more-btn{ margin-top:10px; background:none; border:1px solid var(--inputborder); border-radius:6px; padding:6px 12px;
    font-size:12.5px; color:var(--dim); cursor:pointer; min-height:36px; }
  .more-btn:hover{ color:var(--text); border-color:var(--dim); }
  .deltas h3{ font-size:13px; font-weight:600; color:var(--dim); margin-bottom:6px; }
  dl.kv{ display:grid; grid-template-columns:minmax(0,1fr) auto; }
  dl.kv dt, dl.kv dd{ padding:7px 0; border-bottom:1px solid var(--gridline); font-size:13px; }
  dl.kv dt{ color:var(--dim); }
  dl.kv dd{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  dl.kv dd .s{ font-weight:400; color:var(--muted); font-size:12px; margin-left:6px; }
  .note{ font-size:12px; color:var(--muted); line-height:1.7; margin-top:8px; }

  /* ---- 估值 ---- */
  .verdict{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 28px; align-items:end; margin-bottom:6px; }
  .verdict .big{ font-family:var(--serif); font-size:26px; font-weight:600; line-height:1.2; }
  .verdict .big small{ font-size:15px; color:var(--dim); font-weight:400; }
  .verdict .pos{ text-align:right; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .verdict .pos b{ font-family:var(--serif); font-size:20px; color:var(--text); margin:0 2px; }
  .ruler{ width:100%; margin:6px 0 4px; }
  .ruler svg, .chart svg{ display:block; width:100%; overflow:visible; }
  .chart svg{ touch-action:pan-y; -webkit-tap-highlight-color:transparent; }
  .chart svg:focus:not(:focus-visible){ outline:none; }
  .concl{ font-size:14.5px; line-height:1.8; max-width:52em; margin-top:10px; }
  details.fold{ margin-top:10px; }
  details.fold > summary{ cursor:pointer; font-size:12.5px; color:var(--dim); min-height:32px; display:inline-flex; align-items:center; gap:6px; }
  details.fold > summary::-webkit-details-marker{ display:none; }
  details.fold > summary::before{ content:""; width:0; height:0; border-left:5px solid currentColor;
    border-top:4px solid transparent; border-bottom:4px solid transparent; transition:transform .15s; }
  details.fold[open] > summary::before{ transform:rotate(90deg); }
  details.fold .body{ font-size:12.5px; color:var(--dim); line-height:1.8; padding:6px 0 4px 12px;
    border-left:2px solid var(--gridline); max-width:60em; }
  .grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 36px; }

  .scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.t{ width:100%; border-collapse:collapse; font-size:13px; }
  .t th{ text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:7px 10px 7px 0;
    border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:bottom; }
  .t td{ padding:8px 10px 8px 0; border-bottom:1px solid var(--gridline); vertical-align:top; }
  .t th.num, .t td.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .t td.nw{ white-space:nowrap; }
  .t tr:last-child td{ border-bottom:0; }
  .t tbody tr:hover td{ background:var(--rowhover); }
  .t .rowh{ color:var(--dim); white-space:nowrap; }
  .t .ser{ font-family:var(--serif); font-size:15px; font-weight:600; }
  .t td .sub{ display:block; font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:2px; white-space:normal; }
  /* 事实表: 数字右对齐不换行; 文字型值 (字符串 / unit=text) 左对齐可换行, 超过 28 字的整段放到项目名下面 (跨两列) */
  .t td.txt{ text-align:left; white-space:normal; }
  .t td .ftv{ display:inline-block; max-width:22em; overflow-wrap:anywhere; }
  .t td .ftx{ display:block; margin-top:4px; max-width:48em; color:var(--text); font-size:13px; line-height:1.65; overflow-wrap:anywhere; }
  .t td .per-m{ display:none; }
  table.t.facts td:first-child, .t td .sub{ overflow-wrap:anywhere; }   /* 标签/注里的长标识符 (us-gaap:…|2026|Q2|…) 可断, 不撑宽列 */
  .pstrip{ display:block; }
  .legend{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12px; color:var(--dim); margin:4px 0 2px; }
  .legend i{ display:inline-block; width:14px; height:0; border-top:2px solid; vertical-align:middle; margin-right:6px; }
  .legend i.sq{ width:10px; height:10px; border:0; border-radius:2px; }
  .legend i.ring{ width:9px; height:9px; border:2px solid; border-radius:50%; }

  /* ---- 维度 ---- */
  details.dim{ border-bottom:1px solid var(--gridline); }
  details.dim > summary{ list-style:none; cursor:pointer; display:grid; grid-template-columns:16px minmax(0,1fr) auto;
    gap:10px; align-items:center; min-height:52px; padding:9px 2px; }
  details.dim > summary::-webkit-details-marker{ display:none; }
  details.dim > summary:hover{ background:var(--rowhover); }
  .chev{ width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:1.8; transition:transform .15s; }
  details.dim[open] .chev{ transform:rotate(90deg); }
  .dim-t{ font-size:15px; font-weight:600; }
  .dim-t .en{ font-size:12px; color:var(--muted); font-weight:400; margin-left:8px; }
  .dim-t .fv-pill{ margin-left:8px; font-size:10.5px; vertical-align:2px; }
  .dim-s{ font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .dim-b{ padding:4px 0 26px 26px; }
  .slc{ font-size:12.5px; color:var(--dim); border-left:2px solid var(--accent); padding:2px 0 2px 10px; margin:2px 0 14px; max-width:60em; }
  .md{ max-width:47em; }
  .md p{ margin:0 0 10px; }
  .md h4{ font-size:13.5px; font-weight:650; margin:18px 0 6px; color:var(--text); }
  .md h4:first-child{ margin-top:4px; }
  .md h5{ font-size:13px; font-weight:600; margin:14px 0 4px; color:var(--dim); }
  .md ul, .md ol{ padding-left:1.25em; margin:0 0 10px; }
  .md li{ margin:5px 0; }
  .md strong{ font-weight:650; }
  .md code{ font-size:12px; background:var(--input); border:1px solid var(--gridline); border-radius:3px; padding:0 4px; }
  sup.c{ font-size:10.5px; line-height:0; margin-left:1px; white-space:nowrap; }
  sup.c a{ padding:9px 3px; margin:-9px -3px; }       /* 命中区放大到 ~28px, 行高与字距不变 */
  .blk{ margin-top:18px; }
  .blk > h5{ font-size:12.5px; font-weight:600; color:var(--dim); margin-bottom:6px; }
  ul.judg{ list-style:none; }
  ul.judg li{ padding:9px 0; border-bottom:1px solid var(--gridline); }
  ul.judg li:last-child{ border-bottom:0; }
  ul.judg .cl{ font-size:13.5px; line-height:1.7; }
  ul.judg .im{ font-size:12.5px; color:var(--dim); line-height:1.7; margin-top:3px; }
  ul.judg .im::before{ content:"含义 "; color:var(--muted); }
  .pills{ display:inline-flex; gap:5px; margin-right:6px; vertical-align:1px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ display:inline-flex; gap:6px; align-items:baseline; border:1px solid var(--gridline); border-radius:4px;
    padding:2px 8px; font-size:12px; max-width:100%; }
  .chip .k{ color:var(--muted); overflow-wrap:anywhere; }
  .chip .v{ color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; overflow-wrap:anywhere; }

  /* ---- 跟踪日志 ---- */
  .filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .filters button{ min-height:34px; padding:4px 12px; border:1px solid var(--inputborder); background:var(--input);
    border-radius:6px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .filters button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .filters button .n{ opacity:.75; margin-left:4px; font-variant-numeric:tabular-nums; }
  ol.tl{ list-style:none; }
  ol.tl li{ display:grid; grid-template-columns:84px minmax(0,1fr); gap:10px; padding:10px 0; border-bottom:1px solid var(--gridline); }
  ol.tl .dt{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:1px; }
  ol.tl .ti{ font-size:13.5px; font-weight:600; line-height:1.6; }
  ol.tl .ti a{ color:var(--text); }
  ol.tl .ti a:hover{ color:var(--accent-ink); }
  ol.tl .de{ font-size:12.5px; color:var(--dim); line-height:1.7; margin-top:3px; max-width:60em; }
  ol.tl .de.clamp{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  ol.tl .x{ font-size:12px; color:var(--accent-ink); background:none; border:0; cursor:pointer; padding:2px 0; }

  /* ---- 来源 ---- */
  ol.src{ list-style:none; font-size:12.5px; }
  ol.src li{ display:grid; grid-template-columns:40px minmax(0,1fr); gap:6px; padding:7px 0; border-bottom:1px solid var(--gridline); }
  ol.src li:target{ background:var(--info-bg); }

  footer.foot{ border-top:1px solid var(--border); padding:18px 0 0; font-size:12px; color:var(--muted); line-height:1.8; max-width:62em; }
  footer.foot p{ margin-bottom:6px; }

  /* ---- 浮层 / 空态 ---- */
  .tip{ position:fixed; z-index:90; pointer-events:none; background:var(--card); color:var(--text);
    border:1px solid var(--border); box-shadow:var(--shadow); border-radius:6px; padding:8px 10px; font-size:12px;

  .tip .r b{ font-variant-numeric:tabular-nums; }
  .tip .r span{ color:var(--dim); }
  .empty{ padding:30px 0; color:var(--muted); font-size:13px; }
  .loading main{ opacity:.55; transition:opacity .2s; }

    .page{ padding:0 16px calc(40px + var(--sab)); }

    .mast{ grid-template-columns:minmax(0,1fr); padding-top:18px; }

  /* 通用: 带十字准线的折线/柱图 (一个 y 轴; 不做双轴) */
  function xyChart(host, cfg){
    var W = widthOf(host), H = cfg.height || 220, padL = cfg.padL || 52, padR = cfg.padR || 84, padT = 14, padB = 26;
    var n = cfg.labels.length, pw = W - padL - padR, ph = H - padT - padB;
    var vals = [];
    cfg.series.forEach(function(s){ s.values.forEach(function(v){ if(isNum(v)) vals.push(v); }); });
    if(cfg.band){ vals.push(cfg.band.lo, cfg.band.hi); }
    if(!vals.length){ host.innerHTML = ""; return; }
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if(cfg.zero){ lo = Math.min(0, lo); hi = Math.max(0, hi); }
    else { var padv = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1; lo -= padv; hi += padv; }
    var ticks = niceTicks(lo, hi, cfg.ticks || 4);
    lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    var bw = pw / n;
    function X(i){ return padL + bw * (i + 0.5); }
    function Y(v){ return padT + ph - (v - lo) / (hi - lo) * ph; }
    var g = [];
    ticks.forEach(function(tk){
      var y = Y(tk).toFixed(1);
      g.push('<line x1="' + padL + '" x2="' + (W - padR + 6) + '" y1="' + y + '" y2="' + y + '" stroke="var(--gridline)" stroke-width="1"/>');
      g.push('<text x="' + (padL - 8) + '" y="' + (+y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + esc(cfg.yFmt(tk)) + "</text>");
    });
    if(lo < 0 && hi > 0) g.push('<line x1="' + padL + '" x2="' + (W - padR + 6) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--muted)" stroke-width="1"/>');
    if(cfg.band){
      var y1 = Y(cfg.band.hi), y2 = Y(cfg.band.lo);
      g.push('<rect x="' + padL + '" y="' + y1.toFixed(1) + '" width="' + pw + '" height="' + Math.max(1, y2 - y1).toFixed(1) + '" fill="var(--band)"/>');
      if(isNum(cfg.band.mid)){
        var ym = Y(cfg.band.mid).toFixed(1);
        g.push('<line x1="' + padL + '" x2="' + (padL + pw) + '" y1="' + ym + '" y2="' + ym + '" stroke="var(--band-line)" stroke-width="1"/>');
      }
    }
    var step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / (cfg.xLabelW || 56)))));
    cfg.labels.forEach(function(lb, i){
      if(i % step !== 0 && i !== n - 1) return;
      if(i !== n - 1 && n - 1 - i < step && (n - 1) % step !== 0) return;
      g.push('<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(cfg.xFmt ? cfg.xFmt(lb, i) : lb) + "</text>");
    });
    var ends = [];
    if(cfg.band && isNum(cfg.band.mid) && cfg.band.midLabel)
      ends.push({y: Y(cfg.band.mid), x: padL + pw, text: cfg.band.midLabel, muted: true});
    cfg.series.forEach(function(s){
      if(s.type === "bar"){
        var w = Math.min(24, Math.max(3, bw - 4)), base = Y(Math.max(lo, Math.min(0, hi)));
        s.values.forEach(function(v, i){
          if(!isNum(v)) return;
          var y = Y(v), x = X(i) - w / 2, top = Math.min(y, base), hh = Math.max(1, Math.abs(base - y)), r = Math.min(4, hh, w / 2);
          var op = (cfg.dimIdx && cfg.dimIdx.indexOf(i) >= 0) ? ' fill-opacity="0.45"' : "";
          if(v >= 0) g.push('<path d="M' + x.toFixed(1) + "," + (top + hh).toFixed(1) + " V" + (top + r).toFixed(1) + " Q" + x.toFixed(1) + "," + top.toFixed(1) + " " + (x + r).toFixed(1) + "," + top.toFixed(1) + " H" + (x + w - r).toFixed(1) + " Q" + (x + w).toFixed(1) + "," + top.toFixed(1) + " " + (x + w).toFixed(1) + "," + (top + r).toFixed(1) + " V" + (top + hh).toFixed(1) + ' Z" fill="' + s.color + '"' + op + "/>");
          else g.push('<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hh.toFixed(1) + '" fill="' + s.color + '"' + op + "/>");
        });
        var li = lastIdx(s.values);
        if(li >= 0 && s.endLabel !== false) ends.push({y: Y(s.values[li]), x: X(li) + w / 2 + 4, text: cfg.endFmt(s.values[li]), color: s.color, bar: true});

          if(!isNum(v)){ pen = false; return; }

    ends.forEach(function(e){

        '" fill="var(--' + (e.muted ? "muted" : "text") + ')">' + esc(e.text) + "</text>");

    var svg = host.querySelector("svg"), xh = svg.querySelector(".xh"), cur = -1, down = false, ptrAt = 0;
    function idxAt(clientX){
      var r = svg.getBoundingClientRect(), x = (clientX - r.left) * (W / r.width);
      return Math.max(0, Math.min(n - 1, Math.floor((x - padL) / bw)));
    }
    function hide(){
      xh.setAttribute("visibility", "hidden"); cur = -1;
      if(tipOwner === hide || !tipOwner){ tipOwner = null; hideTip(); }   // 浮层已归另一张图 (比如点了它, 本图随后失焦) 就不动它
    }
    function at(i, cx, cy){
      if(i < 0 || i >= n){ return; }
      cur = i; xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("visibility", "visible");
      showTip(cfg.tip(i), cx, cy, hide);
    }
    // 鼠标: 悬停即读, 移出即收。触屏/笔: 点哪一期读哪一期 (按点的 x 坐标), 按住横拖可扫读;
    // 抬手不收 (触屏抬手必触发 pointerleave), 点图外、滚页面、失焦才收。
    svg.addEventListener("pointerdown", function(ev){
      ptrAt = Date.now();
      if(ev.pointerType === "mouse") return;
      down = true;
      at(idxAt(ev.clientX), ev.clientX, ev.clientY);
    });
    svg.addEventListener("pointermove", function(ev){
      if(ev.pointerType !== "mouse" && !down) return;
      at(idxAt(ev.clientX), ev.clientX, ev.clientY);
    });
    svg.addEventListener("pointerup", function(){ down = false; });
    svg.addEventListener("pointercancel", function(){ down = false; });
    svg.addEventListener("pointerleave", function(ev){ if(ev.pointerType === "mouse") hide(); });
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", function(ev){
      if(ev.key === "Escape"){ hide(); return; }
      if(ev.key !== "ArrowLeft" && ev.key !== "ArrowRight" && ev.key !== "Home" && ev.key !== "End") return;
      ev.preventDefault();
      var r = svg.getBoundingClientRect();
      var i = ev.key === "Home" ? 0 : ev.key === "End" ? n - 1 : (cur < 0 ? n - 1 : cur + (ev.key === "ArrowRight" ? 1 : -1));
      i = Math.max(0, Math.min(n - 1, i));
      at(i, r.left + X(i) * r.width / W, r.top + padT + 10);
    });
    svg.addEventListener("focus", function(){
      var kb;
      try{ kb = svg.matches(":focus-visible"); }catch(e){ kb = Date.now() - ptrAt > 800; }
      if(!kb || cur >= 0) return;                   // 点/触进来的聚焦不弹; 只有键盘 Tab 进来才先显示最后一期
      var r = svg.getBoundingClientRect();
      at(n - 1, r.left + X(n - 1) * r.width / W, r.top + padT + 10);
    });

  function rulerSVG(host){
    var v = DOC.valuation, fr = v.fair_range, sc = v.dcf && v.dcf.scenarios || {}, px = livePrice(), rp = v.price;

    var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts), span = hi - lo || hi * 0.2 || 1;
    lo -= span * 0.06; hi += span * 0.06;
    var W = widthOf(host), padL = 14, padR = 14, H = 150, axisY = 74;
    function X(x){ return padL + (x - lo) / (hi - lo) * (W - padL - padR); }
    var g = [];

    tk.forEach(function(x){
      if(x < lo || x > hi) return;
      var xx = X(x).toFixed(1);
      g.push('<line x1="' + xx + '" x2="' + xx + '" y1="' + (axisY - 3) + '" y2="' + (axisY + 3) + '" stroke="var(--muted)" stroke-width="1"/>');
    });
    g.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + axisY + '" y2="' + axisY + '" stroke="var(--border)" stroke-width="1"/>');
    // 合理区间色带 + 中值
    g.push('<rect x="' + X(fr.low).toFixed(1) + '" y="' + (axisY - 16) + '" width="' + Math.max(2, X(fr.high) - X(fr.low)).toFixed(1) + '" height="32" fill="var(--band)" stroke="var(--band-line)" stroke-width="1"/>');
    g.push('<line x1="' + X(fr.mid).toFixed(1) + '" x2="' + X(fr.mid).toFixed(1) + '" y1="' + (axisY - 16) + '" y2="' + (axisY + 16) + '" stroke="var(--accent-ink)" stroke-width="2"/>');
    // 下方标注: 区间三点 + 三情景, 贪心避让成多行
    var below = [
      {x: fr.low, t: fmt(fr.low, 0), s: t("fair_lo")},
      {x: fr.mid, t: fmt(fr.mid, 0), s: t("fair_mid"), strong: true},
      {x: fr.high, t: fmt(fr.high, 0), s: t("fair_hi")}
    ];
    [["bear","sc_bear"],["base","sc_base"],["bull","sc_bull"]].forEach(function(p){
      var s = sc[p[0]]; if(!s || !isNum(s.value_per_share)) return;
      below.push({x: s.value_per_share, t: fmt(s.value_per_share, 0), s: t(p[1]), dot: true});
    });
    below.forEach(function(b){ b.px = X(b.x); b.w = Math.max(b.t.length * 7.4, b.s.length * 12) + 10; });
    below.sort(function(a, b){ return a.px - b.px; });
    var rows = [];
    below.forEach(function(b){
      var r = 0;
      while(rows[r] && rows[r] > b.px - b.w / 2) r++;
      rows[r] = b.px + b.w / 2; b.row = r;
    });
    below.forEach(function(b){
      var y = axisY + 34 + b.row * 30, xx = b.px.toFixed(1);
      if(b.dot) g.push('<circle cx="' + xx + '" cy="' + axisY + '" r="4.5" fill="var(--card)" stroke="var(--dim)" stroke-width="1.6"/>');
      g.push('<line x1="' + xx + '" x2="' + xx + '" y1="' + (axisY + (b.dot ? 5 : 17)) + '" y2="' + (y - 12) + '" stroke="var(--gridline)" stroke-width="1"/>');
      g.push('<text x="' + xx + '" y="' + y + '" text-anchor="middle" font-family="' + "Georgia, 'Noto Serif SC', serif" + '" font-size="' + (b.strong ? 14 : 13) + '" font-weight="' + (b.strong ? 700 : 600) + '" fill="var(--text)">' + esc(b.t) + "</text>");
      if(b.s) g.push('<text x="' + xx + '" y="' + (y + 14) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(b.s) + "</text>");
    });
    var maxRow = Math.max.apply(null, below.map(function(b){ return b.row; }));
    H = axisY + 34 + maxRow * 30 + 22;
    // 上方: 现价 (实心) 与研究时价 (空心), 两者太近就只画现价并在标签里并注

      if(tops.length === 2 && Math.abs(X(tops[0].x) - X(tops[1].x)) < tw){ anchor = i === 0 ? "end" : "start"; lx = xx + (i === 0 ? 4 : -4); }

        g.push('<text x="' + lx.toFixed(1) + '" y="' + (y0 - 16) + '" text-anchor="' + anchor + '" font-size="13" font-weight="700" fill="var(--text)">' + esc(lab) + "</text>");

  }

  /* ================================================================ 财务趋势图 (量化层 EDGAR 优先, 研究层序列兜底) */
  /* x 轴 = 连续的财年号 (最近 10 年): 哪个序列缺哪年, 那一格留空 (柱不画、线断开), 不把两侧年份拼成相邻 */
  var FY_RE = /^FY(\d{4})$/;
  function fySlots(maps){
    var ys = [];
    maps.forEach(function(m){ Object.keys(m).forEach(function(y){ ys.push(+y); }); });
    if(!ys.length) return [];
    var hi = Math.max.apply(null, ys), lo = Math.max(Math.min.apply(null, ys), hi - 9), out = [];
    for(var y = lo; y <= hi; y++) out.push(y);
    return out;
  }
  function finData(){
    var q = Q(), ef = q && q.edgar_facts, out = {labels: [], rev: [], oi: [], fcf: [], ttm: [], src: "q", gaps: []};
    function byFY(a){ var m = {}; (a || []).forEach(function(p){ var mm = FY_RE.exec(p.label || ""); if(mm) m[+mm[1]] = p; }); return m; }
    if(ef && ef.revenue && (ef.revenue.annual || []).length){
      var R = byFY(ef.revenue.annual), O = byFY(ef.operating_income && ef.operating_income.annual),
          C = byFY(ef.cfo && ef.cfo.annual), X = byFY(ef.capex && ef.capex.annual), lastEnd = "";
      fySlots([R, O, C]).forEach(function(y){
        var r = R[y], o = O[y], c = C[y], x = X[y];
        out.labels.push("FY" + y); out.rev.push(r ? r.value : null); out.oi.push(o ? o.value : null);
        out.fcf.push(c && x ? c.value - x.value : null); out.ttm.push(false);
        if(!r) out.gaps.push("FY" + y);
        [r, o, c].forEach(function(p){ if(p && p.end > lastEnd) lastEnd = p.end; });
      });
      var tr = ef.revenue.ttm, to = ef.operating_income && ef.operating_income.ttm, tc = ef.cfo && ef.cfo.ttm, tx = ef.capex && ef.capex.ttm;
      if(tr && isNum(tr.value) && tr.end > lastEnd){
        out.labels.push("TTM " + tr.end.slice(0, 7)); out.rev.push(tr.value);
        out.oi.push(to && to.end === tr.end ? to.value : null);
        out.fcf.push(tc && tx && isNum(tc.value) && isNum(tx.value) && tc.end === tr.end && tx.end === tr.end ? tc.value - tx.value : null);
        out.ttm.push(true);
      }
      return out;
    }
    var s = DOC.dimensions.financials_trend.series || {};
    function pm(k){
      var fy = {}, tt = {};
      ((s[k] || {}).points || []).forEach(function(p){
        var mm = FY_RE.exec(p.period || "");
        if(mm) fy[+mm[1]] = p.value; else if(/^TTM/.test(p.period || "")) tt[p.period] = p.value;
      });
      return {fy: fy, ttm: tt};
    }
    var r = pm("revenue"), o = pm("operating_income"), f = pm("fcf");
    fySlots([r.fy, o.fy, f.fy]).forEach(function(y){
      out.labels.push("FY" + y); out.rev.push(isNum(r.fy[y]) ? r.fy[y] : null); out.oi.push(isNum(o.fy[y]) ? o.fy[y] : null);
      out.fcf.push(isNum(f.fy[y]) ? f.fy[y] : null); out.ttm.push(false);
      if(!isNum(r.fy[y])) out.gaps.push("FY" + y);
    });
    Object.keys(r.ttm).sort().slice(-1).forEach(function(k){
      out.labels.push(k.replace(/^TTM\s*/, "TTM ")); out.rev.push(r.ttm[k]); out.oi.push(isNum(o.ttm[k]) ? o.ttm[k] : null);
      out.fcf.push(isNum(f.ttm[k]) ? f.ttm[k] : null); out.ttm.push(true);
    });
    out.src = "r";
    return out;
  }

  /* 事实表: 数字 → 右对齐不换行; 文字型 (字符串值或 unit=text) → 左对齐可换行; 超过 28 字的整段放到项目名下 (跨数值列)。
     手机上期间并进数值格 (.per-m), 期间列隐藏 —— 窄屏不再靠横滑才看得到数值。 */
  var FACT_TEXT_MAX = 28;
  var UNIT_WORD = {USD:"美元", USD_bn:"十亿美元", USD_mn:"百万美元", shares:"股", days:"天", x:"x", pct:"%"};
  function isTextFact(f){ return typeof f.value === "string" || f.unit === "text"; }
  function factValue(f){
    var v = f.value, u = f.unit;
    if(typeof v !== "string" || !u || u === "text") return fmtUnit(v, u);
    // 字符串区间 + 数值单位 (如 "175–185" + USD_bn): 两端都按单位换算, 共同的单位后缀只写一次
    var m = /^\s*([+-]?\d[\d,]*(?:\.\d+)?)\s*[–—-]\s*([+-]?\d[\d,]*(?:\.\d+)?)\s*$/.exec(v);
    if(m){
      var a = fmtUnit(+m[1].replace(/,/g, ""), u), b = fmtUnit(+m[2].replace(/,/g, ""), u);
      var sx = / [^ ]+$/.exec(a), sfx = sx && b.slice(-sx[0].length) === sx[0] ? sx[0] : "";
      return (sfx ? a.slice(0, -sfx.length) : a) + "–" + b;
    }
    return esc(v) + (UNIT_WORD[u] ? " " + esc(UNIT_WORD[u]) : "");
  }

        }));
    }
    if(key === "risks"){
      h += simpleTable(t("risks"), [{h: t("r_risk")}, {h: t("r_prob"), nw: 1}, {h: t("r_sev"), nw: 1}, {h: t("r_watch")}, {h: t("f_src")}],
        (d.risk_items || []).map(function(r){
          return [inline(r.risk) + (r.mitigant ? '<span class="sub">' + esc(t("r_mit")) + ": " + inline(r.mitigant) + "</span>" : ""),
            pill("lv", r.probability, t("lv_" + r.probability)), pill("lv", r.severity, t("lv_" + r.severity)), '<span class="dim">' + inline(r.watch_signal || "—") + "</span>", srcLinks(r.source_ids)];
        }));
    }
    if(key === "catalysts_calendar"){
      var ev = (d.events || []).slice().sort(function(a, b){ return String(a.date).localeCompare(String(b.date)); });
      var q = Q(), ec = q && q.earnings_calendar;
      var rows = ev.map(function(e){
        return ['<span class="nw">' + esc(e.date) + "</span>" + (e.confirmed ? "" : '<span class="sub">' + esc(t("est")) + "</span>"),
          inline(e.event) + (e.expected_impact ? '<span class="sub">' + inline(e.expected_impact) + "</span>" : ""),
          '<span class="fv-pill mute">' + esc(KIND_ZH[e.kind] || e.kind) + "</span>", srcLinks(e.source_id)];
      });
      if(ec && ec.next_earnings_date) rows.unshift(['<span class="nw">' + esc(ec.next_earnings_date) + "</span><span class=\"sub\">" + esc(ec.confirmed ? t("confirmed") : t("est")) + "</span>",
        esc(t("next_earn")) + '<span class="sub">' + esc(ec.source) + "</span>", '<span class="fv-pill info">' + esc(KIND_ZH.earnings) + "</span>", ""]);
      h += simpleTable(t("events"), [{h: t("e_date"), nw: 1}, {h: t("e_event")}, {h: t("e_kind"), nw: 1}, {h: t("f_src")}], rows);
    }
    if(key === "quant_unquant_watchlist"){
      h += simpleTable(t("qm"), [{h: t("q_name")}, {h: t("q_cur"), num: 1}, {h: t("q_thr")}, {h: t("q_status"), nw: 1}, {h: t("f_src")}],
        (d.quant_metrics || []).map(function(m){
          return [inline(m.name) + (m.period ? '<span class="sub">' + esc(m.period) + "</span>" : "") + (m.note ? '<span class="sub">' + inline(m.note) + "</span>" : ""),
            fmtUnit(m.current, m.unit), '<span class="dim">' + inline(m.threshold) + "</span>", pill("qs", m.status), srcLinks(m.source_id)];
        }));
      var uq = d.unquant_observations || [];
      if(uq.length) h += '<div class="blk"><h5>' + esc(t("uq")) + '</h5><ul class="judg">' + uq.map(function(o){
        return '<li><div class="cl"><span class="pills">' + pill("conf", o.confidence) + (o.direction ? pill("dir", o.direction) : "") + '</span><span class="mut">' + esc(o.date) + "</span> " +
          inline(o.observation) + srcLinks(o.source_ids) + '</div><div class="im" style="--x:0">' + inline(o.evidence) + "</div></li>";
      }).join("") + "</ul></div>";
    }
    return h;
  }
  function renderDims(){
    var wide = window.matchMedia("(min-width: 761px)").matches;
    var h = secHead("sec_dims", "cap_dims");
    DIMS.forEach(function(k, i){
      var d = DOC.dimensions[k]; if(!d) return;
      h += '<details class="dim" id="dim-' + k + '"' + (wide && i < 3 ? " open" : "") + ">" + dimSummary(k, d) + '<div class="dim-b" data-k="' + k + '"></div></details>';
    });
    var sec = document.getElementById("sec-dims");
    sec.innerHTML = h; sec.hidden = false;
    sec.querySelectorAll("details.dim").forEach(function(det){
      if(det.open) fillDim(det);
      det.addEventListener("toggle", function(){ if(det.open) fillDim(det); });
    });
  }
  function fillDim(det){
    var body = det.querySelector(".dim-b");
    if(body.getAttribute("data-done")) return;
    var k = body.getAttribute("data-k"), d = DOC.dimensions[k];
    var h = "";
    if(d.since_last_change) h += '<div class="slc">' + inline(d.since_last_change) + "</div>";
    h += md(d.narrative_md) + dimSpecial(k, d) + factsTable(d.facts) + judgList(d.judgments) + flagChips(d.quant_flags);
    if(k === "overview_business_model"){
      h += judgList(DOC.summary.thesis_bull, lang() === "en" ? "Bull thesis" : "多方论点") + judgList(DOC.summary.thesis_bear, lang() === "en" ? "Bear thesis" : "空方论点");
      if(DOC.summary.stance_note) h += '<p class="note">' + inline(DOC.summary.stance_note) + "</p>";
    }
    body.innerHTML = h;
    body.setAttribute("data-done", "1");
    var fb = body.querySelector("#finBox");
    if(fb) finCharts(fb);
  }

  /* ================================================================ 跟踪日志 */
  var LOG_OPEN = false;
  function logItems(){
    var items = [], q = Q();
    (DOC.tracking_log || []).forEach(function(e){
      items.push({date: e.date, cat: "research", type: e.type, title: e.title, detail: e.detail, src: e.source_id, impact: e.impact_on_thesis});
    });
    (q && q.filings_recent || []).forEach(function(f){
      var items8 = (f.items || "").split(",").map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){ return ITEM_ZH[x] ? x + " " + ITEM_ZH[x] : x; });
      items.push({date: f.date, cat: "filing", type: "filing", title: (FORM_ZH[f.form] || f.form) + (items8.length ? " · " + items8.join(" / ") : ""),
        url: f.url, detail: f.report_date && f.report_date !== f.date ? (lang() === "en" ? "Period/report date " : "报告期/事件日 ") + f.report_date : ""});
    });
    (q && q.news_headlines || []).forEach(function(n){
      items.push({date: n.date, cat: "news", type: "news", title: n.title, url: n.url, detail: n.publisher});
    });
    items.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    return items;
  }
  function renderLog(){
    var all = logItems(), cats = ["all","research","filing","news"];
    var cnt = {all: all.length, research: 0, filing: 0, news: 0};
    all.forEach(function(x){ cnt[x.cat]++; });
    var list = all.filter(function(x){ return LOGF === "all" || x.cat === LOGF; });
    var shown = LOG_OPEN ? list : list.slice(0, 20);
    var h = secHead("sec_log", "cap_log") + '<div class="filters" role="group">' + cats.map(function(c){
      return '<button type="button" data-f="' + c + '" class="' + (LOGF === c ? "on" : "") + '" aria-pressed="' + (LOGF === c) + '">' + esc(t("log_" + c)) + '<span class="n">' + cnt[c] + "</span></button>";
    }).join("") + '</div><ol class="tl">';
    shown.forEach(function(x){
      var title = x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + "</a>" : inline(x.title);
      var pills = '<span class="fv-pill mute">' + esc(TYPE_ZH[x.type] || x.type) + "</span>" + (x.impact ? " " + pill("imp", x.impact) : "");
      var long = x.detail && x.detail.length > 180;
      h += '<li><span class="dt">' + esc(x.date) + '</span><div><div class="ti"><span class="pills">' + pills + "</span>" + title + (x.src ? srcLinks(x.src) : "") + "</div>" +
        (x.detail ? '<div class="de' + (long ? " clamp" : "") + '">' + inline(x.detail) + "</div>" + (long ? '<button type="button" class="x">' + esc(t("detail_more")) + "</button>" : "") : "") + "</div></li>";
    });
    h += "</ol>";
    if(list.length > 20) h += '<button type="button" class="more-btn" id="logMore">' + esc(LOG_OPEN ? t("wc_less") : t("log_more", {n: list.length})) + "</button>";
    var sec = document.getElementById("sec-log");
    sec.innerHTML = h; sec.hidden = false;
    sec.querySelectorAll(".filters button").forEach(function(b){ b.addEventListener("click", function(){ LOGF = b.getAttribute("data-f"); LOG_OPEN = false; renderLog(); }); });
    var mb = document.getElementById("logMore");
    if(mb) mb.addEventListener("click", function(){ LOG_OPEN = !LOG_OPEN; renderLog(); });
    sec.querySelectorAll("button.x").forEach(function(b){ b.addEventListener("click", function(){
      var de = b.previousElementSibling, open = de.classList.toggle("clamp");
      b.textContent = open ? t("detail_more") : t("detail_less");
    }); });
  }

  /* ================================================================ 来源 */
  function renderSources(){
    var ss = DOC.meta.sources || [];
    var h = secHead("sec_sources", "cap_sources") + '<ol class="src">';
    ss.forEach(function(s){
      h += '<li id="src-' + s.id + '"><span class="id">[' + s.id + ']</span><div><div class="tt"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + "</a>" +
        '<span class="fv-pill mute">' + esc(SRC_ZH[s.type] || s.type) + '</span></div><div class="mt">' + esc(s.publisher) +
        (s.date ? " · " + esc(t("src_pub")) + " " + esc(s.date) : "") + " · " + esc(t("src_acc")) + " " + esc(s.accessed) + (s.edgar_ref ? " · " + esc(s.edgar_ref) : "") + "</div>" +
        (s.note ? '<div class="nt">' + inline(s.note) + "</div>" : "") + "</div></li>";
    });
    h += "</ol>";
    var sec = document.getElementById("sec-sources");
    sec.innerHTML = h; sec.hidden = false;
  }

  var SRCK = {zh:{edgar_submissions:"EDGAR 公告清单", edgar_companyfacts:"EDGAR 财务数据", prices:"价格", yf_info:"Yahoo 概况",
      yf_estimates:"Yahoo 一致预期", yf_news:"Yahoo 新闻"},
    en:{edgar_submissions:"EDGAR filings", edgar_companyfacts:"EDGAR financials", prices:"Prices", yf_info:"Yahoo profile",
      yf_estimates:"Yahoo consensus", yf_news:"Yahoo news"}};
  function renderFoot(){
    var q = Q(), src = q && q.sources ? (lang() === "en" ? "Quant inputs fetched: " : "量化层取数: ") + Object.keys(q.sources).map(function(k){
      var s = q.sources[k];
      return (SRCK[lang()][k] || k) + " " + hm(s.fetched_at) + (s.ok ? "" : (lang() === "en" ? " (failed, cached)" : " (本次失败, 用缓存)"));
    }).join("; ") : "";
    document.getElementById("foot").innerHTML = "<p>" + esc(t("foot1")) + "</p><p>" + esc(t("foot2")) + "</p><p>" + esc(t("foot3")) + "</p>" +
      (src ? '<p class="mut">' + esc(src) + "</p>" : "");
  }

  /* ================================================================ 左侧章节栏 */
  var railObs = null;
  function renderRail(){
    var rail = document.getElementById("rail");
    var h = '<a href="#top" data-go="top">' + esc(t("rail_top")) + "</a>" +
      '<a href="#sec-changes">' + esc(t("sec_changes")) + '</a><a href="#sec-valuation">' + esc(t("sec_valuation")) + "</a>" +
      '<div class="grp">' + esc(t("rail_dims")) + "</div>" +
      DIMS.map(function(k){ var d = DOC.dimensions[k]; return d ? '<a class="sub" href="#dim-' + k + '" data-open="' + k + '">' + esc(d.title_cn) + "</a>" : ""; }).join("") +
      '<a href="#sec-log">' + esc(t("sec_log")) + '</a><a href="#sec-sources">' + esc(t("sec_sources")) + "</a>";
    rail.innerHTML = h;
    if(railObs) railObs.disconnect();
    if(!("IntersectionObserver" in window)) return;
    var links = {};
    rail.querySelectorAll("a[href^='#']").forEach(function(a){ links[a.getAttribute("href").slice(1)] = a; });
    railObs = new IntersectionObserver(function(ents){
      ents.forEach(function(en){
        if(!en.isIntersecting) return;
        var a = links[en.target.id]; if(!a) return;
        rail.querySelectorAll("a.on").forEach(function(x){ x.classList.remove("on"); });
        a.classList.add("on");
      });
    }, {rootMargin: "-120px 0px -65% 0px"});
    ["sec-changes","sec-valuation","sec-log","sec-sources"].concat(DIMS.map(function(k){ return "dim-" + k; })).forEach(function(id){
      var el = document.getElementById(id); if(el) railObs.observe(el);
    });
  }

  /* ================================================================ 装配 */
  function renderAll(){
    if(window.fvShell) fvShell.applyI18n(T);
    fixCrumb();
    if(!INDEX) return;
    renderTabs();
    if(!DOC) return;
    SRC_IDS = {};
    (DOC.meta.sources || []).forEach(function(s){ SRC_IDS[s.id] = s.title + " — " + s.publisher; });
    document.title = shortName(DOC.meta.name_cn) + " " + DOC.meta.ticker + " · " + t("title") + " · FairValpha";
    CHARTS = [];
    dismissTip();
    renderMast(); renderChanges(); renderValuation(); renderDims(); renderLog(); renderSources(); renderFoot(); renderRail();
  }

  var loadSeq = 0;
  function loadDoc(ticker, push){
    var c = (INDEX.companies || []).filter(function(x){ return x.ticker === ticker; })[0] || INDEX.companies[0];
    if(!c) return;
    CUR = c.ticker;
    try{ localStorage.setItem("fv_deepdive_last", CUR); }catch(e){}
    if(push !== false) try{ history.replaceState(null, "", "#" + CUR); }catch(e){}
    renderTabs();
    document.body.classList.add("loading");
    var seq = ++loadSeq;
    fetch("data/" + c.file + "?t=" + Date.now(), {cache: "no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        if(seq !== loadSeq) return;
        DOC = j; WC_OPEN = false; LOG_OPEN = false; LOGF = "all";
        renderAll();
        document.body.classList.remove("loading");
        var hs = (location.hash || "").slice(1);
        if(hs && hs.toUpperCase() !== CUR){
          var el = document.getElementById(hs);
          if(el && el.tagName === "DETAILS") el.open = true;
          if(el) setTimeout(function(){ el.scrollIntoView(); }, 30);
        }
      })
      .catch(function(e){
        if(seq !== loadSeq) return;
        document.body.classList.remove("loading");
        document.getElementById("mast").innerHTML = '<p class="empty">' + esc(t("err_doc")) + esc(c.file) + " (" + esc(e.message) + ")</p>";
      });
  }

  function onClick(ev){
    var tab = ev.target.closest(".cotab");
    if(tab){ if(tab.getAttribute("data-t") !== CUR){ loadDoc(tab.getAttribute("data-t")); window.scrollTo(0, 0); } return; }
    var op = ev.target.closest("[data-open]");
    if(op){
      var det = document.getElementById("dim-" + op.getAttribute("data-open"));
      if(det && !det.open){ det.open = true; }
    }
    var top = ev.target.closest("[data-go=top]");
    if(top){ ev.preventDefault(); window.scrollTo({top: 0, behavior: "smooth"}); }
  }
  function onKey(ev){
    var tab = ev.target.closest && ev.target.closest(".cotab");
    if(!tab || (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft")) return;
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".cotab")), i = tabs.indexOf(tab);
    var nx = tabs[(i + (ev.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    if(nx){ nx.focus(); nx.click(); }
  }
  var rsT = null;
  function onResize(){
    clearTimeout(rsT);
    rsT = setTimeout(function(){ dismissTip(); CHARTS.forEach(function(c){ if(c.host && c.host.isConnected) c.fn(); }); }, 150);
  }

  function boot(){
    fallbackHeader();
    if(window.fvShell){
      fvShell.onLang(renderAll);
      fvShell.onTheme(function(){ dismissTip(); CHARTS.forEach(function(c){ if(c.host && c.host.isConnected) c.fn(); }); });
      var cr = document.getElementById("fvCrumb");
      if(cr) new MutationObserver(fixCrumb).observe(cr, {childList: true, characterData: true, subtree: true});
    }
    if(window.fvShell) fvShell.applyI18n(T);
    fixCrumb();
    document.addEventListener("click", onClick);
    document.addEventListener("keydown", onKey);
    window.addEventListener("resize", onResize);
    // 触屏的提示框: 点图外任何地方、或页面滚动了 (弹出后 300ms 起算, 躲开聚焦时的自动滚动), 就收起
    document.addEventListener("pointerdown", function(ev){
      if(tipOwner && !(ev.target.closest && ev.target.closest(".chart svg"))) dismissTip();
    }, true);
    window.addEventListener("scroll", function(){ if(tipOwner && Date.now() - tipShownAt > 300) dismissTip(); }, {passive: true});
    window.addEventListener("hashchange", function(){
      var h = (location.hash || "").slice(1).toUpperCase();
      if(INDEX && h && h !== CUR && (INDEX.companies || []).some(function(c){ return c.ticker === h; })){ loadDoc(h, false); return; }
      var el = document.getElementById((location.hash || "").slice(1));       // 手动改成 #dim-xxx 也展开那一章
      if(el && el.tagName === "DETAILS" && !el.open) el.open = true;
    });
    fetch("data/index.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        INDEX = j;
        var known = function(tk){ return tk && (j.companies || []).some(function(c){ return c.ticker === tk; }); };
        var want = (location.hash || "").slice(1).toUpperCase().split(/[\/?]/)[0], last = null;
        try{ last = localStorage.getItem("fv_deepdive_last"); }catch(e){}
        var anchor = !known(want) && location.hash.length > 1 ? location.hash : "";
        loadDoc(known(want) ? want : (known(last) ? last : (j.companies[0] && j.companies[0].ticker)), !anchor);
      })
      .catch(function(){
        document.body.classList.remove("loading");
        document.getElementById("mast").innerHTML = '<p class="empty">' + esc(t("err_index")) + "</p>";
      });
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, {once: true});
  else boot();
})();
</script>
</body>
</html>
