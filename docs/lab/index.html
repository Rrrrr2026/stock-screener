<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>量化工作台 · FairValpha</title>
<link rel="stylesheet" href="/shared/fv-shell.css?v=2">
<style>
  /* 令牌全部来自 /shared/fv-shell.css (与两市工作台同名同值)。
     颜色铁律 (状态色 B 案): 涨跌 = 裸色数字 (--up 红 / --down 绿);
     状态/评价 = 实心药丸 .fv-pill (通过绿 / 未过红 / 研究中蓝)。 */
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text);
        font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .wrap{ max-width:1280px; margin:0 auto; padding:14px 18px calc(60px + var(--sab)); }
  header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  h1{ font-size:19px; }
  html.fv-shell-on header h1{ display:none; }
  .tabs{ display:flex; gap:4px; }
  .tab{ padding:6px 14px; border:1px solid var(--inputborder); border-radius:8px; cursor:pointer;
        font-size:13px; color:var(--dim); background:var(--input); }
  .tab.on{ color:#fff; background:var(--accent); border-color:var(--accent); }
  .tab.dis{ opacity:.45; cursor:default; }
  .xlinks{ display:flex; gap:10px; font-size:12px; }
  .mkt{ margin-left:auto; display:flex; gap:4px; }
  html.fv-shell-on .mkt{ display:none; }   /* 市场分段已由共享外壳接管 (外壳没跑成时这排按钮兜底) */
  .mkt button{ padding:5px 14px; font-size:13px; border:1px solid var(--inputborder); background:var(--input);
               color:var(--dim); border-radius:8px; cursor:pointer; }
  .mkt button.on{ color:#fff; background:var(--accent); border-color:var(--accent); }
  #metabar{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim);
            background:var(--card); border:1px solid var(--border); border-radius:10px;
            padding:8px 14px; margin-bottom:12px; }
  #metabar b{ color:var(--text); }
  .cols{ display:grid; grid-template-columns:330px 1fr; gap:12px; }
  .cols > *{ min-width:0; }   /* 网格项默认 min-width:auto, 宽表会把整列撑爆 → 手机横向滚动 */
  @media (max-width:960px){ .cols{ grid-template-columns:1fr; } .wrap{ padding:12px 10px calc(48px + var(--sab)); } }
  .panel{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .panel h2{ margin-bottom:8px; }
  .panel h2 .sub{ font-size:11.5px; font-weight:400; color:var(--muted); }
  .grp{ border:1px dashed var(--inputborder); border-radius:8px; padding:8px; margin-bottom:8px; }
  .grp .ghead{ font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; }
  .cond{ display:flex; gap:4px; margin-bottom:5px; align-items:center; flex-wrap:wrap; }
  select,input,button{ background:var(--input); color:var(--text); border:1px solid var(--inputborder);
        border-radius:6px; padding:5px 6px; font-size:12px; font-family:inherit; }
  input{ width:64px; }
  input.wide{ width:100px; }
  button{ cursor:pointer; }
  button:hover{ border-color:var(--accent); }
  select:focus-visible,input:focus-visible,button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .x{ color:var(--muted); border:none; background:none; font-size:14px; padding:0 4px; }
  .x:hover{ color:var(--fail); }
  .addrow{ font-size:12px; margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  #runBtn{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .preset{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px;
           cursor:pointer; font-size:12.5px; background:var(--input); }
  .preset:hover{ border-color:var(--accent); }
  .preset .pn{ color:var(--text); font-weight:600; }
  .preset .pe{ color:var(--muted); font-size:11.5px; margin-top:3px; line-height:1.5; }
  .ev{ font-size:10.5px; padding:0 6px; }        /* 证据药丸 (表格/条件行内的紧凑版) */
  #resmeta{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px;
            color:var(--dim); margin-bottom:8px; }
  #resmeta b{ color:var(--accent-ink); font-size:15px; }
  .scroll{ overflow-x:auto; }
  table{ border-collapse:collapse; font-size:12px; width:100%; }
  th{ text-align:right; color:var(--dim); font-weight:500; padding:5px 7px; cursor:pointer;
      border-bottom:1px solid var(--border); white-space:nowrap; user-select:none;
      position:sticky; top:0; background:var(--head); z-index:2; }
  th:hover{ color:var(--accent); }
  th:first-child,th:nth-child(2),th:nth-child(3){ text-align:left; }
  td{ padding:5px 7px; border-bottom:1px solid var(--gridline); white-space:nowrap;
      text-align:right; font-variant-numeric:tabular-nums; }
  td:first-child,td:nth-child(2),td:nth-child(3){ text-align:left; }
  tr:hover td{ background:var(--rowhover); }
  .up{ color:var(--up); } .down{ color:var(--down); } .muted{ color:var(--muted); }
  a{ color:var(--accent-ink); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .note{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.7; }
  /* 页级告警: 通栏琥珀底 + ⚠️, 永不进表格单元格 (规格 §8 约束) */
  .alert{ display:block; padding:6px 10px; border-radius:8px; font-size:12px; line-height:1.6;
          background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line); }
  .savebar{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  @media (max-width:640px){
    .wrap{ padding-left:8px; padding-right:8px; }
    header{ gap:8px; }
    input,select{ font-size:16px; }         /* 防 iOS 聚焦缩放 */
    .cond select{ max-width:150px; }   /* 用 px 不用 vw: 部分内嵌/模拟环境里 vw 解析的不是可见视口 */
    .addrow button,.savebar button{ min-height:34px; }
    #resTbl{ font-size:11.5px; }
  }
</style>
</head>
<body>
<script>window.FV_SHELL_CFG={page:"lab", from:"a", markets:true};</script>
<script src="/shared/fv-shell.js?v=2"></script>
<div class="wrap">
  <header>
    <h1 data-i18n="page_title">量化工作台</h1>
    <div class="tabs">
      <div class="tab on" id="tabScan" data-i18n="tab_scan">筛选器</div>
      <div class="tab dis" data-i18n="tab_sig" data-i18n-title="tab_sig_t" title="W2 建设中">信号台</div>
      <div class="tab dis" data-i18n="tab_slab" data-i18n-title="tab_slab_t" title="W3 建设中">策略实验室</div>
    </div>
    <div class="xlinks">
      <a href="/rightside/" data-i18n="lk_rightside">→ 右侧工作台</a>
      <a href="/strategies/" data-i18n="lk_strategies">→ 策略库</a>
    </div>
    <div class="mkt">
      <button id="mA" class="on" data-i18n="mkt_a">A股</button><button id="mU" data-i18n="mkt_us">美股</button>
    </div>
  </header>

  <div id="metabar" data-i18n="loading">加载中…</div>

  <div class="cols">
    <div>
      <div class="panel" style="margin-bottom:12px">
        <h2 class="fv-h"><span data-i18n="p_conds">筛选条件</span><span class="sub" data-i18n="p_conds_sub">（组内 AND，组间 OR）</span></h2>
        <div id="groups"></div>
        <div class="addrow">
          <button id="addGrp" data-i18n="btn_addgrp">+ 或组</button>
          <button id="runBtn" data-i18n="btn_run">▶ 运行筛选</button>
          <button id="clearBtn" data-i18n="btn_clear">清空</button>
        </div>
        <div class="savebar">
          <input class="wide" id="saveName" data-i18n-ph="ph_scheme" placeholder="方案名">
          <button id="saveBtn" data-i18n="btn_save">保存</button>
          <select id="loadSel" style="max-width:130px"></select>
          <button id="delBtn" data-i18n="btn_del">删</button>
        </div>
        <div class="note" id="evLegend"></div>
      </div>
      <div class="panel">
        <h2 class="fv-h" data-i18n="p_presets">预设模板（荐股 · 带战绩出处）</h2>
        <div id="presets"></div>
      </div>
    </div>

    <div class="panel">
      <div id="resmeta"></div>
      <div class="scroll" style="max-height:72vh;overflow-y:auto"><table id="resTbl"></table></div>
    </div>
  </div>
</div>

/* ================= 状态 ================= */
let MKT = (FV.market==="us") ? "us" : "a";
let DATA=null, IDXOF={}, groups=[], sortKey="ret20", sortDesc=true, cols=[...DEFAULT_COLS];
const $=s=>document.querySelector(s);

/* 证据药丸: ★通过=绿 / ⚠️反向(已停发)=红 / 🔬研究中=蓝 —— 一律实心药丸, 与裸色涨跌数字区分 */
const EV_CLS = {star:"pass", warn:"fail", lab:"info"};
const EV_SYM = {star:"★", warn:"⚠️", lab:"🔬"};
const EV_KEY = {star:"ev_star", warn:"ev_warn", lab:"ev_lab"};
function evPill(grade, text, compact){
  return `<span class="fv-pill ${EV_CLS[grade]}${compact?" ev":""}" title="${(text||"").replace(/"/g,"&quot;")}">${EV_SYM[grade]}${compact?"":" "+t(EV_KEY[grade])}</span>`;
}
function evBadge(f){
  const e = f.ev && f.ev[MKT==="a"?"a":"u"];
  if(!e) return "";
  return " " + evPill(e.g, L(e), true);
}
function drawLegend(){
  $("#evLegend").innerHTML = t("ev_legend", {
    star: evPill(S, ""), warn: evPill(W, ""), lab: evPill(B, "")
  });
}
function fieldOptions(sel){
  const gm={};
  FIELDS_META.forEach(f=>{ if(f.t==="str")return; (gm[f.g]=gm[f.g]||[]).push(f); });
  let h="";
  for(const g in gm){
    h+=`<optgroup label="${t(g)}">`+gm[g].map(f=>`<option value="${f.k}" ${f.k===sel?"selected":""}>${L(f)}</option>`).join("")+`</optgroup>`;
  }
  return h;
}
function opOptions(f,sel){
  const ty=FM[f].t;
  let ops;
  if(ty==="bool") ops=[["is","op_is"],["not","op_not"]];
  else if(ty==="enum") ops=[["eq","op_eq"],["ne","op_ne"]];
  else ops=[[">","op_gt"],["<","op_lt"],[">=","op_ge"],["<=","op_le"],["between","op_between"],
            ["topP","op_topP"],["botP","op_botP"],["vsF","op_vsF"]];
  return ops.map(([v,k])=>`<option value="${v}" ${v===sel?"selected":""}>${t(k)}</option>`).join("");
}
function condHTML(gi,ci,c){
  const f=FM[c[0]], op=c[1], ty=f.t;
  let inputs="";
  if(ty==="bool") inputs="";
  else if(ty==="enum") inputs=`<select data-r="v1">${(f.opts||[]).map(([v,k])=>`<option value="${v}" ${v===c[2]?"selected":""}>${t(k)}</option>`).join("")}</select>`;
  else if(op==="between") inputs=`<input data-r="v1" value="${c[2]??""}"> ~ <input data-r="v2" value="${c[3]??""}">`;
  else if(op==="vsF") inputs=`<select data-r="vf">${fieldOptions(c[2])}</select><input data-r="v2" value="${c[3]??1}" title="${t("mul_title")}">`;
  else inputs=`<input data-r="v1" value="${c[2]??""}">`;
  return `<div class="cond" data-g="${gi}" data-c="${ci}">
    <select data-r="f">${fieldOptions(c[0])}</select>
    <select data-r="op">${opOptions(c[0],op)}</select>${inputs}
    <span>${evBadge(f)}</span>
    <button class="x" data-r="del" aria-label="✕">✕</button></div>`;
}
function render(){
  $("#groups").innerHTML = groups.map((g,gi)=>`<div class="grp">
    <div class="ghead"><span>${t("grp_head",{n:gi+1})}</span>
      <span><button class="x" data-r="addc" data-g="${gi}">${t("btn_addcond")}</button>
      ${groups.length>1?`<button class="x" data-r="delg" data-g="${gi}">${t("btn_delgrp")}</button>`:""}</span></div>
    ${g.map((c,ci)=>condHTML(gi,ci,c)).join("")}</div>`).join("");
}
function readUI(){
  document.querySelectorAll(".cond").forEach(el=>{
    const gi=+el.dataset.g, ci=+el.dataset.c, c=groups[gi][ci];
    c[0]=el.querySelector('[data-r="f"]').value;
    c[1]=el.querySelector('[data-r="op"]').value;
    const v1=el.querySelector('[data-r="v1"]'), v2=el.querySelector('[data-r="v2"]'), vf=el.querySelector('[data-r="vf"]');
    if(FM[c[0]].t==="enum") c[2]=v1?v1.value:c[2];
    else if(c[1]==="vsF"){ c[2]=vf?vf.value:c[2]; c[3]=v2?parseFloat(v2.value):1; }
    else { c[2]=v1&&v1.value!==""?parseFloat(v1.value):null; c[3]=v2&&v2.value!==""?parseFloat(v2.value):null; }
  });
}
$("#groups").addEventListener("change",e=>{ readUI(); if(e.target.dataset.r==="f"||e.target.dataset.r==="op") render(); });
$("#groups").addEventListener("click",e=>{
  const r=e.target.dataset.r;
  if(r==="del"){ readUI(); const el=e.target.closest(".cond"); groups[+el.dataset.g].splice(+el.dataset.c,1); render(); }
  if(r==="addc"){ readUI(); groups[+e.target.dataset.g].push(["ret20",">",0,null]); render(); }
  if(r==="delg"){ readUI(); groups.splice(+e.target.dataset.g,1); render(); }
});
$("#addGrp").onclick=()=>{ readUI(); groups.push([["ret20",">",0,null]]); render(); };
$("#clearBtn").onclick=()=>{ groups=[[["trend_up","is",1,null]]]; render(); run(); };

/* ================= 筛选执行 ================= */
function colIdx(k){ return IDXOF[k]; }
function passCond(row,c,pctCache){
  const [k,op,v1,v2]=c, x=row[colIdx(k)];
  if(op==="is") return x===true;
  if(op==="not") return x===false;
  if(x==null) return false;
  if(op==="eq") return x===v1;
  if(op==="ne") return x!==v1;
  if(op===">") return x>v1;
  if(op==="<") return x<v1;
  if(op===">=") return x>=v1;
  if(op==="<=") return x<=v1;
  if(op==="between") return x>=Math.min(v1,v2)&&x<=Math.max(v1,v2);
  if(op==="topP"||op==="botP"){
    let arr=pctCache[k];
    if(!arr){ arr=DATA.rows.map(r=>r[colIdx(k)]).filter(v=>v!=null).sort((a,b)=>a-b); pctCache[k]=arr; }
    const rank=(arr.length-lowerBound(arr,x))/arr.length*100;   // 前%: 值越大排名越前
    return op==="topP"? rank<=v1 : (lowerBound(arr,x)/arr.length*100)<=v1;
  }
  if(op==="vsF"){ const y=row[colIdx(v1)]; return y!=null && x > y*(v2??1); }
  return true;
}
function lowerBound(a,x){ let lo=0,hi=a.length; while(lo<hi){const m=(lo+hi)>>1; if(a[m]<x)lo=m+1;else hi=m;} return lo; }
let lastRows=[];
function run(){
  if(!DATA) return;
  readUI();
  const pctCache={};
  const out=[];
  for(const row of DATA.rows){
    let ok=false;
    for(const g of groups){
      if(g.every(c=>passCond(row,c,pctCache))){ ok=true; break; }
    }
    if(ok) out.push(row);
  }
  lastRows=out;
  drawTable();
}
function enumLabel(k,v){
  const o=(FM[k].opts||[]).find(p=>p[0]===v);
  return o ? t(o[1]) : v;
}
function drawTable(){
  const si=colIdx(sortKey);
  const rows=[...lastRows].sort((a,b)=>{
    const x=a[si],y=b[si];
    if(x==null)return 1; if(y==null)return -1;
    return sortDesc? (y>x?1:-1):(x>y?1:-1);
  });
  const topN=Math.min(rows.length, 500);
  $("#resmeta").innerHTML=`${t("res_hit")} <b>${lastRows.length}</b> ${t("res_of",{n:topN})} ${fl(sortKey)}${sortDesc?"↓":"↑"}
    <button id="csvBtn">${t("btn_csv")}</button>`;
  $("#csvBtn").onclick=exportCSV;
  const head=cols.map(k=>`<th data-k="${k}">${fl(k)}${k===sortKey?(sortDesc?" ↓":" ↑"):""}</th>`).join("");
  const body=rows.slice(0,topN).map(r=>{
    return "<tr>"+cols.map(k=>{
      let v=r[colIdx(k)];
      if(v==null) return '<td class="muted">—</td>';
      if(k==="code"){
        const url=MKT==="a"?`https://quote.eastmoney.com/${v.startsWith("6")?"sh":"sz"}${v}.html`:`https://www.tradingview.com/chart/?symbol=${v}`;
        return `<td><a href="${url}" target="_blank" rel="noopener">${v}</a></td>`;
      }
      if(typeof v==="boolean") return `<td>${v?'<span class="fv-pill pass ev">✓</span>':""}</td>`;
      if(FM[k].t==="enum") return `<td>${enumLabel(k,v)}</td>`;
      if(FM[k].pct||["chg1","gap"].includes(k)){
        const c=v>0?"up":(v<0?"down":"");     // 裸色数字 = 红涨绿跌
        return `<td class="${c}">${v}%</td>`;
      }
      return `<td>${v}</td>`;
    }).join("")+"</tr>";
  }).join("");
  $("#resTbl").innerHTML=`<tr>${head}</tr>${body}`;
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDesc=!sortDesc; else { sortKey=k; sortDesc=true; }
    drawTable();
  });
}
function exportCSV(){
  const head=cols.map(k=>fl(k)).join(",");
  const lines=lastRows.map(r=>cols.map(k=>{const v=r[colIdx(k)];return v==null?"":String(v).replace(/,/g,"，");}).join(","));
  const blob=new Blob(["﻿"+head+"\n"+lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`scan_${MKT}_${DATA.meta.generated}.csv`; a.click();
}

/* ================= 预设/保存 ================= */
function drawPresets(){
  $("#presets").innerHTML=PRESETS[MKT].map((p,i)=>`<div class="preset" data-i="${i}">
    <div class="pn">${L(p)}</div><div class="pe">${FV.lang==="en"?p.eve:p.evz}</div></div>`).join("");
  document.querySelectorAll(".preset").forEach(el=>el.onclick=()=>{
    groups=[PRESETS[MKT][+el.dataset.i].conds.map(c=>[...c])];
    render(); run();
  });
}
const LSKEY="fv_lab_screens_v1";
function loadSaved(){
  let s={}; try{s=JSON.parse(localStorage.getItem(LSKEY)||"{}")}catch(e){}
  $("#loadSel").innerHTML=`<option value="">${t("opt_load")}</option>`+Object.keys(s).map(n=>`<option>${n}</option>`).join("");
  return s;
}
$("#saveBtn").onclick=()=>{
  const n=$("#saveName").value.trim(); if(!n)return;
  readUI(); const s=loadSaved(); s[n]={m:MKT,g:groups};
  try{localStorage.setItem(LSKEY,JSON.stringify(s))}catch(e){}
  loadSaved();
};
$("#loadSel").onchange=e=>{
  const s=loadSaved()[e.target.value]; if(!s)return;
  groups=s.g; render(); run();
};
$("#delBtn").onclick=()=>{
  const n=$("#loadSel").value; if(!n)return;
  const s=loadSaved(); delete s[n];
  try{localStorage.setItem(LSKEY,JSON.stringify(s))}catch(e){}
  loadSaved();
};

/* ================= 加载 ================= */
function setMkt(m){
  MKT = (m==="us") ? "us" : "a";
  $("#mA").classList.toggle("on",MKT==="a"); $("#mU").classList.toggle("on",MKT==="us");
  boot();
}
$("#mA").onclick=()=>setMkt("a"); $("#mU").onclick=()=>setMkt("us");
FV.onMarket(setMkt);
FV.onLang(()=>{
  FV.applyI18n(T);
  document.title = t("page_title")+" · FairValpha";
  drawLegend(); render(); loadSaved();
  if(DATA){ renderMeta(); drawPresets(); drawTable(); }
});

function renderMeta(){
  const m=DATA.meta;
  const regKey = m.regime==="bull" ? "reg_bull" : (m.regime==="bear" ? "reg_bear" : (m.regime==="range" ? "reg_range" : null));
  const regTxt = regKey ? t(regKey) : m.regime;
  /* regime 是方向, 不是好坏 → 用裸色数字那一套 (红涨绿跌 + 箭头), 绝不做成药丸,
     否则红药丸会被读成"未过"、绿药丸被读成"通过"。 */
  const reg = m.regime==="bull" ? `<b class="up">▲ ${regTxt}</b>`
            : m.regime==="bear" ? `<b class="down">▼ ${regTxt}</b>`
            : `<b class="muted">◆ ${regTxt}</b>`;
  $("#metabar").innerHTML=`<span>${t("meta_date")} <b>${m.generated}</b></span>
    <span>${t("meta_regime")} ${reg}</span>
    <span>${t("meta_vol")} <b>${m.vol_state}</b></span>
    <span>${t("meta_idx20")} <b class="${m.idx.ret20>0?"up":"down"}">${m.idx.ret20}%</b></span>
    <span>${t("meta_dist")} <b>${m.idx.dist_hi250}%</b></span>
    <span>${t("meta_pool")} <b>${m.n}</b> ${t("meta_unit")}</span>
    <span class="muted">${t("meta_factors",{n:DATA.fields.length})}</span>`;
}
function boot(){
  $("#metabar").textContent=t("loading");
  fetch(`./factors_${MKT}.json`,{cache:"no-store"}).then(r=>{
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(d=>{
    DATA=d; IDXOF=Object.fromEntries(d.fields.map((k,i)=>[k,i]));
    renderMeta();
    if(!groups.length) groups=[[["trend_up","is",1,null]]];
    render(); drawPresets(); loadSaved(); run();
  }).catch(e=>{
    $("#metabar").innerHTML=`<span class="alert">⚠️ ${t("load_fail",{m:MKT,e:e.message})}</span>`;
    $("#resTbl").innerHTML=""; $("#resmeta").textContent="";
  });
}
FV.applyI18n(T);
document.title = t("page_title")+" · FairValpha";
drawLegend();
loadSaved();
$("#mA").classList.toggle("on",MKT==="a"); $("#mU").classList.toggle("on",MKT==="us");
boot();
</script>
