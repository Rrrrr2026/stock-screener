<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据总览 · FairValpha</title>
<link rel="stylesheet" href="/shared/fv-shell.css?v=1">
<style>
  /* 令牌: 与两市工作台 dashboard/index.html :root / body.light 逐字同名同值 (深海军蓝)。
     这里内联一份是刻意的兜底 —— /shared/fv-shell.css 万一没同步过来, 本页仍然是对的皮肤。
     颜色铁律 (B 案): 状态一律实心药丸 (.pill), 涨跌数字才用裸色 —— 本页没有涨跌数字。 */
  :root{
    --bg:#0b1220; --card:#111a2e; --border:#1e2a44; --text:#e5e7eb; --dim:#9fb4d6; --muted:#7e93b8;
    --head:#0e1830; --rowhover:#16223c; --input:#0e1830; --inputborder:#26344f; --gridline:#1b2640;
    --drawer:#0b1220;
    --ok:#3ddc97; --ok-bg:rgba(61,220,151,.12); --bad:#ff5c5c; --bad-bg:rgba(255,92,92,.12);
    --accent:#2962ff; --accent-ink:#7ab0ff;
    --tabbar-h:56px; --sab:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
  }
  body.light, :root[data-theme="light"]{
    --bg:#eef2f8; --card:#ffffff; --border:#d7e0ee; --text:#0f172a; --dim:#334155; --muted:#64748b;
    --head:#eaf0f8; --rowhover:#eaf1fb; --input:#ffffff; --inputborder:#cbd5e1; --gridline:#e6ecf5;
    --drawer:#f6f8fc;
    --ok:#0c8a54; --ok-bg:rgba(12,138,84,.12); --bad:#c22525; --bad-bg:rgba(194,37,37,.10);
    --accent:#2962ff; --accent-ink:#0b57d0;
    color-scheme:light;
  }
  /* 外壳没跑成 (fv-shell.js 缺失) 时跟随系统, 免得白天一片漆黑 */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]):not([data-theme="light"]){
      --bg:#eef2f8; --card:#ffffff; --border:#d7e0ee; --text:#0f172a; --dim:#334155; --muted:#64748b;
      --head:#eaf0f8; --rowhover:#eaf1fb; --input:#ffffff; --inputborder:#cbd5e1; --gridline:#e6ecf5;
      --drawer:#f6f8fc;
      --ok:#0c8a54; --ok-bg:rgba(12,138,84,.12); --bad:#c22525; --bad-bg:rgba(194,37,37,.10);
      --accent-ink:#0b57d0; color-scheme:light;
    }
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text);
        font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  a{ color:var(--accent-ink); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .wrap{ max-width:1180px; margin:0 auto; padding:14px 20px calc(40px + var(--sab)); }

  header.page{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  header.page h1{ font-size:20px; font-weight:700; }
  html.fv-shell-on header.page h1{ display:none; }
  header.page .sub{ font-size:12px; color:var(--muted); }
  #asof{ margin-left:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* ---- 摘要条 ---- */
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px; }
  .tile{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 14px; }
  .tile .k{ font-size:12px; color:var(--muted); margin-bottom:5px; }
  .tile .v{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; }
  .tile .s{ font-size:11px; color:var(--dim); margin-top:4px; }
  .tile.ok .v{ color:var(--ok); } .tile.bad .v{ color:var(--bad); }
  .tile .sess{ font-size:14px; white-space:nowrap; }

  /* ---- 工具条 ---- */
  .bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; }
  .chip{ border:1px solid var(--inputborder); background:var(--input); color:var(--dim);
         border-radius:8px; padding:4px 11px; cursor:pointer; font:inherit; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .rule{ color:var(--muted); font-size:11.5px; line-height:1.65; margin-left:auto; max-width:640px; }

  /* ---- 表 ---- */
  .card{ background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
  th{ text-align:left; color:var(--dim); font-weight:500; padding:7px 10px; background:var(--head);
      border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; z-index:2; }
  td{ padding:8px 10px; border-bottom:1px solid var(--gridline); vertical-align:top;
      font-variant-numeric:tabular-nums; }
  tbody tr:hover td{ background:var(--rowhover); }
  tr.grp td{ background:var(--head); color:var(--text); font-weight:600; font-size:12px;
             padding:6px 10px; border-bottom:1px solid var(--border); }
  tr.grp .n{ color:var(--muted); font-weight:400; margin-left:6px; }
  .nm{ font-weight:600; color:var(--text); white-space:nowrap; }
  .meta{ font-size:11px; color:var(--muted); margin-top:3px; line-height:1.5;
         word-break:break-all; max-width:430px; }
  .meta code{ font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:10.5px; }
  /* 新鲜度规则: 每行都自证"凭什么判它红" —— 靠左一道细线, 与路径/备注区分开 */
  .meta.rule{ color:var(--dim); word-break:normal; border-left:2px solid var(--border);
              padding-left:7px; margin-top:5px; }
  .meta.rule b{ color:var(--muted); font-weight:600; }
  .num{ text-align:right; white-space:nowrap; }
  .dimtxt{ color:var(--dim); white-space:nowrap; }
  .mut{ color:var(--muted); }
  .pill{ display:inline-block; padding:1px 9px; border-radius:100px; font-size:11.5px; font-weight:600;
         line-height:1.6; white-space:nowrap; border:1px solid transparent; }
  .pill.ok{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
  .pill.bad{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad); }
  .pill.na{ background:var(--input); color:var(--muted); border-color:var(--inputborder); }
  .empty{ padding:22px 14px; color:var(--muted); font-size:13px; text-align:center; }
  .foot{ font-size:11.5px; color:var(--muted); line-height:1.8; margin-top:10px; }

  /* 外壳缺席时的极简页头 (与 #fvShell 同尺寸同皮肤) */
  #fvFallback{ position:sticky; top:0; z-index:60; height:48px; display:flex; align-items:center;
    gap:8px; padding:0 10px; background:var(--card); border-bottom:1px solid var(--border); }
  #fvFallback a{ color:var(--dim); font-size:13px; font-weight:600; }
  #fvFallback span{ font-size:14px; font-weight:600; color:var(--text); }

  @media (max-width:640px){
    .wrap{ padding:12px 10px calc(32px + var(--sab)); }
    .tiles{ grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:8px; }
    .tile .v{ font-size:19px; }
    .rule{ margin-left:0; max-width:none; }
    .meta{ max-width:300px; }
    th,td{ padding:6px 8px; }
  }
</style>
</head>
<body>
<script>window.FV_SHELL_CFG={page:"data", from:"a", markets:false};</script>
<script src="/shared/fv-shell.js?v=1"></script>

<div class="wrap">
  <header class="page">
    <h1 data-i18n="title">数据总览</h1>
    <span class="sub" data-i18n="sub">交易台手上的每一个库 · 行数 / 跨度 / 新鲜度</span>
    <span id="asof" data-i18n="loading">加载中…</span>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <button type="button" class="chip on" id="fAll" data-i18n="f_all">全部</button>
    <button type="button" class="chip" id="fStale" data-i18n="f_stale">只看陈旧</button>
    <span class="rule" id="ruleTxt"></span>
  </div>

  <div class="card">
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-i18n="th_name">数据集 Dataset</th>
          <th data-i18n="th_state">状态 State</th>
          <th class="num" data-i18n="th_rows">行数 Rows</th>
          <th class="num" data-i18n="th_codes">代码数 Codes</th>
          <th data-i18n="th_span">时间跨度 Span</th>
          <th data-i18n="th_updated">更新时间 Updated</th>
          <th data-i18n="th_cadence">节奏 Cadence</th>
          <th class="num" data-i18n="th_size">体量 Size</th>
        </tr></thead>
        <tbody id="tb"><tr><td colspan="8" class="empty" data-i18n="loading">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------- i18n */
  var T = {
    zh:{
      title:"数据总览", sub:"交易台手上的每一个库 · 行数 / 跨度 / 新鲜度", loading:"加载中…",
      k_total:"总库数", k_fresh:"新鲜", k_stale:"陈旧", k_size:"总体量", k_session:"预期收盘日",
      s_total:"含表级拆分", s_unrated:"不判新鲜度 {n} 个", s_size:"物理文件去重后",
      th_name:"数据集 Dataset", th_state:"状态 State", th_rows:"行数 Rows", th_codes:"代码数 Codes",
      th_span:"时间跨度 Span", th_updated:"更新时间 Updated", th_cadence:"节奏 Cadence", th_size:"体量 Size",
      p_fresh:"新鲜", p_stale:"陈旧", p_na:"—", p_frozen:"冻结",
      alert_note:"看板产物 / 研究产物落后会推方糖告警 (微信), 产物整个缺失同样告警; 其余分类 (行情库 / 流水线库 / 估值库 / 分析师目标 / 副本与在建) 只在本页判红, 不推送; 冻结中的库 (如估值库等 Tushare P3) 不判新鲜度, 出灰色「冻结」。",
      f_all:"全部", f_stale:"只看陈旧", none:"没有符合条件的数据集",
      err:"catalog.json 读不到 —— 目录还没跑过, 或产物没同步到本站。",
      mkt_a:"A股", mkt_us:"美股", mkt_cross:"跨市 / 运维",
      foot:"由 stock-core/research/data_catalog.py 每日 19:30 (CEST, 周一至周六) 生成 · 只读盘点, 不改任何库。",
      exp:"应到", host:"生成于", rule_l:"新鲜度规则:"
    },
    en:{
      title:"Data Catalog", sub:"Every store the desk owns · rows / span / freshness", loading:"Loading…",
      k_total:"Datasets", k_fresh:"Fresh", k_stale:"Stale", k_size:"Total size", k_session:"Expected session",
      s_total:"tables counted separately", s_unrated:"{n} not rated", s_size:"deduped by file",
      th_name:"Dataset", th_state:"State", th_rows:"Rows", th_codes:"Codes",
      th_span:"Span", th_updated:"Updated", th_cadence:"Cadence", th_size:"Size",
      p_fresh:"Fresh", p_stale:"Stale", p_na:"—", p_frozen:"Frozen",
      alert_note:"A dashboard or research output that is stale — or missing altogether — raises a Server酱 (WeChat) alert; every other group (price stores, pipeline stores, the valuation store, analyst targets, copies) is only flagged red on this page and never paged; frozen stores (e.g. the valuation store awaiting Tushare P3) are not rated at all and show a grey “Frozen” pill.",
      f_all:"All", f_stale:"Stale only", none:"No dataset matches",
      err:"catalog.json unavailable — the catalog has not run yet, or the output is not synced here.",
      mkt_a:"A-share", mkt_us:"US", mkt_cross:"Cross / Ops",
      foot:"Generated by stock-core/research/data_catalog.py at 19:30 CEST Mon–Sat · read-only inventory.",
      exp:"expected", host:"host", rule_l:"Freshness rule:"
    }
  };
  function lang(){ return (window.fvShell && window.fvShell.lang === "en") ? "en" : "zh"; }
  function t(k){ var d = T[lang()]; return (d && d[k] != null) ? d[k] : T.zh[k]; }

  /* ------------------------------------------- 外壳: 面包屑补字 + 缺席兜底 */
  var CRUMB = { zh:"数据总览", en:"Data Catalog" };
  function fixCrumb(){
    var el = document.getElementById("fvCrumb"); if(!el) return;
    var want = CRUMB[lang()];
    if(el.textContent !== want) el.textContent = want;   // fv-shell.js 没有 site_data 键, 这里替它补上
  }
  function fallbackHeader(){
    if(document.getElementById("fvShell") || document.getElementById("fvFallback")) return;
    var h = document.createElement("header");
    h.id = "fvFallback";
    h.innerHTML = '<a href="/a/">←</a><span></span>';
    h.querySelector("span").textContent = "FairValpha › " + CRUMB[lang()];
    document.body.insertBefore(h, document.body.firstChild);
    document.documentElement.classList.add("fv-shell-on");
  }

  /* ------------------------------------------------------------ 格式化 */
  var NF = function(n){ return (n == null) ? "—" : Number(n).toLocaleString("en-US"); };
  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  /* 路径显示去掉机器前缀 (C:\Users\xxx\ 或 /srv/stock/), 完整路径挂 title 上 */
  var ROOT_RE = /^(?:[A-Za-z]:[\\\/]Users[\\\/][^\\\/]+[\\\/]|\/srv\/stock\/)/;
  function shortPath(p){ return String(p || "").replace(ROOT_RE, ""); }

  function span(d){
    if(d.first_date && d.last_date) return esc(d.first_date) + " → " + esc(d.last_date);
    if(d.last_date) return "→ " + esc(d.last_date);
    return "—";
  }

  var MKT_ORDER = ["a","us","cross"];
  var GRP_ORDER = ["行情库","估值库","流水线库","看板产物","分析师目标","研究产物","副本与在建","运维"];
  var DATA = null, onlyStale = false;

  /* ------------------------------------------------------------ 渲染 */
  function renderTiles(){
    var s = DATA.summary, box = document.getElementById("tiles");
    var sess = DATA.sessions || {};
    box.innerHTML =
      tile("", t("k_total"), NF(s.n), t("s_total")) +
      tile("ok",  t("k_fresh"), NF(s.fresh), t("s_unrated").replace("{n}", NF(s.unrated))) +
      tile("bad", t("k_stale"), NF(s.stale), "") +
      tile("", t("k_size"), esc(s.total_human || "—"), t("s_size")) +
      tile("", t("k_session"),
           '<span class="sess">' + t("mkt_a") + " " + esc(sess.a || "—") + "</span>",
           t("mkt_us") + " " + esc(sess.us || "—"));
  }
  function tile(cls, k, v, s){
    return '<div class="tile ' + cls + '"><div class="k">' + esc(k) + '</div><div class="v">' + v +
           '</div>' + (s ? '<div class="s">' + esc(s) + "</div>" : "") + "</div>";
  }

  function renderTable(){
    var tb = document.getElementById("tb");
    var rows = DATA.datasets.filter(function(d){ return !onlyStale || d.fresh === false; });
    if(!rows.length){ tb.innerHTML = '<tr><td colspan="8" class="empty">' + esc(t("none")) + "</td></tr>"; return; }
    var en = lang() === "en";
    rows.sort(function(a,b){
      var m = MKT_ORDER.indexOf(a.market) - MKT_ORDER.indexOf(b.market); if(m) return m;
      var g = GRP_ORDER.indexOf(a.group) - GRP_ORDER.indexOf(b.group); if(g) return g;
      return 0;
    });
    var html = "", key = "";
    rows.forEach(function(d){
      var k = d.market + "|" + d.group;
      if(k !== key){
        key = k;
        var n = rows.filter(function(x){ return x.market === d.market && x.group === d.group; }).length;
        html += '<tr class="grp"><td colspan="8">' + esc(t("mkt_" + d.market)) + " · " +
                esc(en ? (d.group_en || d.group) : d.group) +
                '<span class="n">' + n + "</span></td></tr>";
      }
      var pill = d.fresh === true  ? '<span class="pill ok">' + esc(t("p_fresh")) + "</span>"
               : d.fresh === false ? '<span class="pill bad">' + esc(t("p_stale")) + "</span>"
               : d.frozen          ? '<span class="pill na" title="' + esc((d.frozen.since || "") + " → " +
                                     (d.frozen.until || "")) + '">' + esc(t("p_frozen")) + "</span>"
               : '<span class="pill na">' + esc(t("p_na")) + "</span>";
      var expl = (d.fresh === false && d.expected_date)
        ? '<div class="meta">' + esc(t("exp")) + " " + esc(d.expected_date) + "</div>" : "";
      var meta = '<div class="meta" title="' + esc(d.path) + '"><code>' + esc(shortPath(d.path)) + "</code>" +
                 (d.note ? " · " + esc(d.note) : "") + "</div>";
      var rl = en ? (d.rule_en || d.rule) : d.rule;
      var rmeta = rl ? '<div class="meta rule"><b>' + esc(t("rule_l")) + "</b> " + esc(rl) + "</div>" : "";
      html += "<tr>" +
        '<td><div class="nm">' + esc(en ? (d.name_en || d.name) : d.name) + "</div>" + meta + rmeta + "</td>" +
        "<td>" + pill + expl + "</td>" +
        '<td class="num">' + NF(d.rows) + "</td>" +
        '<td class="num">' + NF(d.codes) + "</td>" +
        '<td class="dimtxt">' + span(d) + "</td>" +
        '<td class="dimtxt">' + esc(d.updated_at || "—") + "</td>" +
        '<td class="mut">' + esc(d.expected_cadence || "—") + "</td>" +
        '<td class="num mut">' + esc(d.size_human || "—") +
          (d.size_scope === "file" && d.kind === "sqlite" ? '<div class="meta">整库 whole DB</div>' : "") +
        "</td></tr>";
    });
    tb.innerHTML = html;
  }

  function renderAll(){
    if(window.fvShell) fvShell.applyI18n(T);
    fixCrumb();
    document.title = t("title") + " · FairValpha";
    if(!DATA) return;
    document.getElementById("asof").textContent =
      DATA.generated + " · " + t("host") + " " + (DATA.host || "?") + " · " + DATA.elapsed_s + "s";
    var rtxt = ((lang() === "en" ? (DATA.rule_en || DATA.rule) : DATA.rule) || "");
    if(!DATA.alert) rtxt += (rtxt ? " " : "") + t("alert_note");   // 旧 catalog.json 没有告警口径, 页面补
    document.getElementById("ruleTxt").textContent = rtxt;
    document.getElementById("foot").textContent =
      t("foot") + (DATA.errors && DATA.errors.length ? "  ⚠ " + DATA.errors.join(" · ") : "");
    renderTiles(); renderTable();
  }

  /* ------------------------------------------------------------ 启动 */
  document.getElementById("fAll").addEventListener("click", function(){
    onlyStale = false; this.classList.add("on");
    document.getElementById("fStale").classList.remove("on"); renderTable();
  });
  document.getElementById("fStale").addEventListener("click", function(){
    onlyStale = true; this.classList.add("on");
    document.getElementById("fAll").classList.remove("on"); renderTable();
  });

  function boot(){
    fallbackHeader();
    if(window.fvShell){
      fvShell.onLang(renderAll);
      var c = document.getElementById("fvCrumb");
      if(c) new MutationObserver(fixCrumb).observe(c, {childList:true, characterData:true, subtree:true});
    }
    fetch("catalog.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ DATA = j; renderAll(); })
      .catch(function(){
        document.getElementById("asof").textContent = "";
        document.getElementById("tb").innerHTML =
          '<tr><td colspan="8" class="empty">' + esc(t("err")) + "</td></tr>";
      });
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, {once:true});
  else boot();
})();
</script>
</body>
</html>
